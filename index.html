<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보관함</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="보관함">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9e4f7">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9e4f7;--fg:#3d3560;--accent:#7a66d8;--muted:#7a73a0;--chip:#d8d0f0;--line:#c4b8ec}
@media (prefers-color-scheme: dark){:root{--bg:#231f33;--fg:#e6e1f7;--accent:#8a76e0;--muted:#a29bc8;--chip:#342e4d;--line:#4a4270}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
button,select,input{font-family:inherit}
header{display:flex;justify-content:flex-start;align-items:center;gap:8px;padding:14px 16px 8px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.6}
input[type=file]{display:none}
#chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;background:var(--chip);color:var(--fg);border:0;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.chip.add{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
#newRow{display:none;gap:8px;padding:0 16px 10px}
#newRow.open{display:flex}
#newRow input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--muted);background:var(--bg);color:var(--fg);font-size:15px}
#albumBar{display:none;justify-content:space-between;align-items:center;padding:0 16px 8px;color:var(--muted);font-size:13px}
#albumBar.open{display:flex}
.small{background:var(--chip);color:var(--fg);border:0;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
#status{color:var(--muted);font-size:13px;padding:0 16px 6px;min-height:18px}
#empty{color:var(--muted);text-align:center;padding:60px 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px;padding:4px}
#grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer;display:block;background:var(--chip)}
.cell{position:relative}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:8px;padding:2px 7px;pointer-events:none}

#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock.off{display:none}
.lockbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.lockbox svg{width:44px;height:44px;margin:0 auto;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lockbox h2{margin:0;font-size:20px;font-weight:600}
.lockbox p{margin:0;font-size:13px;color:var(--muted);min-height:18px}
.lockbox input{padding:13px 14px;border-radius:12px;border:1px solid var(--muted);background:var(--bg);color:var(--fg);font-size:16px;text-align:center}
.lockbox .btn{padding:13px 14px;font-size:16px}

#viewer{position:fixed;inset:0;background:#000;color:#fff;display:none;z-index:10;transition:background .2s;user-select:none;-webkit-user-select:none}
#viewer.open{display:block}
html.imm,html.imm body{background:#000}
html.wht,html.wht body{background:#fff}
#viewer.ui{background:#fff;color:#1c1c1e;--chip:#f0f0f3;--fg:#1c1c1e;--muted:#8e8e93}
@media (prefers-color-scheme: dark){#viewer.ui{background:#000;color:#f2f2f7;--chip:#2c2c2e;--fg:#f2f2f7;--muted:#98989d}html.wht,html.wht body{background:#000!important}}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;transition:padding .2s}
#viewer.ui #stage{padding:calc(72px + env(safe-area-inset-top,0px)) 0 calc(158px + env(safe-area-inset-bottom,0px))}
#big{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
#bigv{display:none;max-width:100%;max-height:100%;background:#000}
.vc{position:absolute;left:0;right:0;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
#viewer.ui .vc{opacity:1;visibility:visible}
#vTop{top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
#vBack{width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);color:var(--fg);font-size:24px;line-height:1;cursor:pointer}
#vDate{text-align:center}
#vDate b{display:block;font-size:15px;font-weight:600}
#vDate span{font-size:12px;color:var(--muted)}
#strip{bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;overflow-x:auto;padding:0 16px;height:60px;align-items:center;-webkit-overflow-scrolling:touch}
#strip img{height:46px;width:34px;object-fit:cover;border-radius:5px;flex:0 0 auto;opacity:.65;cursor:pointer;transition:width .15s,height .15s}
#strip img.cur{width:50px;height:56px;opacity:1;outline:2px solid var(--accent)}
#vBar{bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.cb{position:relative;height:52px;min-width:52px;border-radius:26px;border:0;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:0}
.cb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#moveSel{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.pill{padding:0 6px;cursor:default}
.pill button{background:none;border:0;color:inherit;font-size:24px;width:40px;height:48px;cursor:pointer}
#pos{font-size:14px;min-width:56px;text-align:center}
#delete.armed{background:#d9534f;color:#fff;padding:0 20px}
</style>
</head>
<body>
<header>
  <button class="small" id="lockBtn">잠금</button>
  <button class="small" id="faceBtn" style="display:none"></button>
  <label class="btn" for="file" style="margin-left:auto">사진·영상 추가</label>
  <input id="file" type="file" accept="image/*,video/*" multiple>
</header>
<div id="chips"></div>
<div id="newRow">
  <input id="newName" type="text" placeholder="항목 이름 (예: 여행, 가족)" maxlength="30">
  <button class="btn" id="newOk">만들기</button>
</div>
<div id="albumBar"><span id="albumInfo"></span><button class="small" id="albumDel">이 항목 삭제</button></div>
<div id="status"></div>
<div id="empty">사진이 없어요. "사진·영상 추가"를 눌러 보세요.</div>
<div id="grid"></div>

<div id="viewer">
  <div id="stage"><img id="big" alt=""><video id="bigv" controls playsinline></video></div>
  <div id="vTop" class="vc">
    <button id="vBack" aria-label="닫기">‹</button>
    <div id="vDate"><b id="vDateB"></b><span id="vDateS"></span></div>
    <span></span>
  </div>
  <div id="strip" class="vc"></div>
  <div id="vBar" class="vc">
    <label class="cb" aria-label="항목 이동"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><select id="moveSel"></select></label>
    <div class="cb pill"><button id="prev" aria-label="이전">‹</button><span id="pos"></span><button id="next" aria-label="다음">›</button></div>
    <button class="cb" id="delete" aria-label="삭제"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
  </div>
</div>

<div id="lock">
  <div class="lockbox">
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <h2 id="lockTitle">보관함 잠김</h2>
    <p id="lockSub"></p>
    <input id="pw1" type="password" placeholder="비밀번호" autocomplete="current-password">
    <input id="pw2" type="password" placeholder="비밀번호 다시 입력" autocomplete="new-password" style="display:none">
    <button class="btn" id="lockGo">열기</button>
    <button class="small" id="faceGo" style="display:none;padding:11px">Face ID로 열기</button>
    <p id="lockMsg"></p>
  </div>
</div>

<script>
const DB_NAME = "photo-vault", PHOTOS = "photos", ALBUMS = "albums", VIDS = "vids", META = "meta";
let db = null, currentId = null;
let photos = [], albums = [];
let current = "all";
let viewList = [], viewIdx = 0, curVidUrl = null;
let key = null, vaultRaw = null;
let setupMode = false, fails = 0, lockedUntil = 0, hiddenAt = 0;

const $ = (id) => document.getElementById(id);
const grid = $("grid"), empty = $("empty"), statusEl = $("status"), viewer = $("viewer"), big = $("big"), stage = $("stage"), strip = $("strip"), bigv = $("bigv");
const lockEl = $("lock"), pw1 = $("pw1"), pw2 = $("pw2"), lockMsg = $("lockMsg"), lockGo = $("lockGo"), faceGo = $("faceGo");

/* ---------- 저장소 ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, 4);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(PHOTOS)) d.createObjectStore(PHOTOS, { keyPath: "id", autoIncrement: true });
      if (!d.objectStoreNames.contains(ALBUMS)) d.createObjectStore(ALBUMS, { keyPath: "id", autoIncrement: true });
      if (!d.objectStoreNames.contains(VIDS)) d.createObjectStore(VIDS, { keyPath: "id" });
      if (!d.objectStoreNames.contains(META)) d.createObjectStore(META, { keyPath: "id" });
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
const store = (name, mode) => db.transaction(name, mode).objectStore(name);
function run(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

/* ---------- 암호화 (AES-GCM, 비밀번호 → PBKDF2) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
async function deriveRaw(password, salt, iter) {
  const base = await crypto.subtle.importKey("raw", te.encode(password), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, base, 256));
}
const importKey = (raw) => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
async function encBytes(bytes) {
  const iv = rnd(12);
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, bytes);
  return { iv, data };
}
async function decBytes(iv, data) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data));
}
const encJson = (o) => encBytes(te.encode(JSON.stringify(o)));
async function decJson(rec) { return JSON.parse(td.decode(await decBytes(rec.iv, rec.data))); }

function photoMeta(p) {
  return { dataUrl: p.dataUrl, name: p.name, added: p.added, albumId: p.albumId == null ? null : p.albumId, type: p.type || "image", duration: p.duration || 0 };
}
async function savePhoto(meta, file) {
  const e = await encJson(meta);
  const id = await run(store(PHOTOS, "readwrite").add({ v: 2, iv: e.iv, data: e.data }));
  if (file) {
    try {
      const ve = await encBytes(new Uint8Array(await file.arrayBuffer()));
      await run(store(VIDS, "readwrite").put({ id, iv: ve.iv, data: ve.data, vtype: file.type || "video/mp4" }));
    } catch (err) {
      await run(store(PHOTOS, "readwrite").delete(id));
      throw err;
    }
  }
  return id;
}
async function putPhoto(p) {
  const e = await encJson(photoMeta(p));
  await run(store(PHOTOS, "readwrite").put({ id: p.id, v: 2, iv: e.iv, data: e.data }));
}
async function removePhoto(id) {
  await run(store(PHOTOS, "readwrite").delete(id));
  await run(store(VIDS, "readwrite").delete(id));
}

// 예전(암호화 전) 데이터가 있으면 암호화해서 교체
async function migrateLegacy() {
  const recs = await run(store(PHOTOS, "readonly").getAll());
  for (const r of recs) {
    if (r.v === 2) continue;
    try {
      let dataUrl = r.dataUrl;
      if (!dataUrl && r.blob && r.type !== "video") dataUrl = await toDataUrl(r.blob);
      if (!dataUrl) { await run(store(PHOTOS, "readwrite").delete(r.id)); continue; }
      if (r.type === "video" && r.blob) {
        const ve = await encBytes(new Uint8Array(await r.blob.arrayBuffer()));
        await run(store(VIDS, "readwrite").put({ id: r.id, iv: ve.iv, data: ve.data, vtype: r.blob.type || "video/mp4" }));
      }
      const e = await encJson({ dataUrl, name: r.name, added: r.added, albumId: r.albumId == null ? null : r.albumId, type: r.type || "image", duration: r.duration || 0 });
      await run(store(PHOTOS, "readwrite").put({ id: r.id, v: 2, iv: e.iv, data: e.data }));
    } catch (err) { /* 변환 실패한 항목은 그대로 둠 */ }
  }
  const arecs = await run(store(ALBUMS, "readonly").getAll());
  for (const r of arecs) {
    if (r.v === 2 || !r.name) continue;
    const e = await encJson({ name: r.name, created: r.created || Date.now() });
    await run(store(ALBUMS, "readwrite").put({ id: r.id, v: 2, iv: e.iv, data: e.data }));
  }
}

function toDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.9));
      };
      img.onerror = () => reject(new Error("이미지를 읽을 수 없어요: " + file.name));
      img.src = reader.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function loadAll() {
  await migrateLegacy();
  const recs = await run(store(PHOTOS, "readonly").getAll());
  const list = [];
  for (const r of recs) {
    if (r.v !== 2) continue;
    try { const o = await decJson(r); o.id = r.id; list.push(o); } catch (e) { /* 복호화 실패 항목 건너뜀 */ }
  }
  photos = list.sort((a, b) => b.id - a.id);
  const arecs = await run(store(ALBUMS, "readonly").getAll());
  const al = [];
  for (const r of arecs) {
    if (r.v !== 2) continue;
    try { const o = await decJson(r); o.id = r.id; al.push(o); } catch (e) {}
  }
  albums = al.sort((a, b) => a.id - b.id);
  if (typeof current === "number" && !albums.some(a => a.id === current)) current = "all";
  render();
}

function albumOf(p) { return p.albumId == null ? "none" : p.albumId; }
function filtered() { return photos.filter(p => current === "all" || albumOf(p) === current); }

function render() {
  const chips = $("chips");
  chips.innerHTML = "";
  const mk = (label, k) => {
    const b = document.createElement("button");
    b.className = "chip" + (current === k ? " on" : "");
    b.textContent = label;
    b.onclick = () => { current = k; render(); };
    chips.appendChild(b);
  };
  mk(`전체 ${photos.length}`, "all");
  const noneCount = photos.filter(p => p.albumId == null).length;
  if (noneCount) mk(`미분류 ${noneCount}`, "none");
  for (const a of albums) mk(`${a.name} ${photos.filter(p => p.albumId === a.id).length}`, a.id);
  const add = document.createElement("button");
  add.className = "chip add";
  add.textContent = "+ 새 항목";
  add.onclick = () => { $("newRow").classList.add("open"); $("newName").focus(); };
  chips.appendChild(add);

  const cur = albums.find(a => a.id === current);
  $("albumBar").classList.toggle("open", !!cur);
  if (cur) $("albumInfo").textContent = `"${cur.name}" 항목`;

  const list = filtered();
  grid.innerHTML = "";
  empty.style.display = list.length ? "none" : "block";
  for (const p of list) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const img = document.createElement("img");
    img.src = p.dataUrl;
    img.alt = p.name || "";
    cell.appendChild(img);
    if (p.type === "video") {
      const d = document.createElement("span");
      d.className = "dur";
      d.textContent = "▶ " + fmtDur(p.duration);
      cell.appendChild(d);
    }
    cell.onclick = () => openViewer(p.id);
    grid.appendChild(cell);
  }
}

async function addFiles(files) {
  const list = files.filter(f => f.type.startsWith("image/") || f.type.startsWith("video/") || /\.(heic|heif|mov|mp4|m4v)$/i.test(f.name));
  const albumId = typeof current === "number" ? current : null;
  let count = 0;
  for (const file of list) {
    try {
      statusEl.textContent = `암호화해서 저장 중... (${count + 1}/${list.length})`;
      if (file.type.startsWith("video/") || /\.(mov|mp4|m4v)$/i.test(file.name)) {
        if (file.size > 100 * 1024 * 1024) throw new Error("영상이 너무 커요 (100MB 이하만 가능): " + file.name);
        const v = await videoPoster(file);
        await savePhoto({ dataUrl: v.dataUrl, name: file.name, added: Date.now(), albumId, type: "video", duration: v.duration }, file);
      } else {
        const dataUrl = await toDataUrl(file);
        await savePhoto({ dataUrl, name: file.name, added: Date.now(), albumId, type: "image", duration: 0 });
      }
      count++;
    } catch (err) {
      statusEl.textContent = err.message;
    }
  }
  if (count) statusEl.textContent = `${count}개 저장했어요.`;
  await loadAll();
}

async function createAlbum() {
  const name = $("newName").value.trim();
  if (!name) return;
  const e = await encJson({ name, created: Date.now() });
  const id = await run(store(ALBUMS, "readwrite").add({ v: 2, iv: e.iv, data: e.data }));
  $("newName").value = "";
  $("newRow").classList.remove("open");
  current = id;
  await loadAll();
}

/* ---------- 영상 ---------- */
function fmtDur(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function grayPoster() {
  const c = document.createElement("canvas");
  c.width = 480; c.height = 480;
  const x = c.getContext("2d");
  x.fillStyle = "#3a3a46";
  x.fillRect(0, 0, 480, 480);
  return c.toDataURL("image/jpeg", 0.8);
}
function videoPoster(file) {
  return new Promise((resolve) => {
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "metadata";
    let done = false, tried = 0, timer = null, blobUrl = null;
    const finish = (dataUrl) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      resolve({ dataUrl: dataUrl || grayPoster(), duration: isFinite(v.duration) ? v.duration : 0 });
    };
    const attempt = () => {
      clearTimeout(timer);
      timer = setTimeout(retry, 6000);
      if (tried === 0) { blobUrl = URL.createObjectURL(file); v.src = blobUrl; }
      else {
        const r = new FileReader();
        r.onload = () => { v.src = r.result; };
        r.onerror = () => finish(null);
        r.readAsDataURL(file);
      }
    };
    const retry = () => {
      if (done) return;
      tried++;
      if (tried > 1 || file.size > 80 * 1024 * 1024) finish(null); else attempt();
    };
    v.onerror = retry;
    v.onloadedmetadata = () => { try { v.currentTime = Math.min(0.1, (v.duration || 1) / 2); } catch (e) {} };
    v.onseeked = () => {
      try {
        const w = v.videoWidth, h = v.videoHeight;
        if (!w || !h) return retry();
        const s = Math.min(1, 480 / Math.max(w, h));
        const c = document.createElement("canvas");
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        finish(c.toDataURL("image/jpeg", 0.8));
      } catch (e) { retry(); }
    };
    attempt();
  });
}
function stopVideo() {
  bigv.onerror = null;
  bigv.pause();
  bigv.removeAttribute("src");
  bigv.removeAttribute("poster");
  bigv.load();
  if (curVidUrl) { URL.revokeObjectURL(curVidUrl); curVidUrl = null; }
}
async function playVideo(p) {
  stopVideo();
  bigv.poster = p.dataUrl;
  try {
    const rec = await run(store(VIDS, "readonly").get(p.id));
    if (!rec || currentId !== p.id) return;
    const buf = await decBytes(rec.iv, rec.data);
    if (currentId !== p.id) return;
    const blob = new Blob([buf], { type: rec.vtype || "video/mp4" });
    let fell = false;
    bigv.onerror = () => {
      if (fell) return;
      fell = true;
      const r = new FileReader();
      r.onload = () => { bigv.src = r.result; };
      r.readAsDataURL(blob);
    };
    curVidUrl = URL.createObjectURL(blob);
    bigv.src = curVidUrl;
  } catch (e) {
    statusEl.textContent = "영상을 열 수 없어요.";
  }
}

/* ---------- 전체 화면 뷰어 ---------- */
function buildStrip() {
  strip.innerHTML = "";
  viewList.forEach((p, i) => {
    const t = document.createElement("img");
    t.src = p.dataUrl;
    t.alt = "";
    t.onclick = () => { viewIdx = i; showPhoto(); };
    strip.appendChild(t);
  });
}

function showPhoto() {
  const p = viewList[viewIdx];
  if (!p) return;
  currentId = p.id;
  const isVid = p.type === "video";
  big.style.display = isVid ? "none" : "";
  bigv.style.display = isVid ? "block" : "none";
  if (isVid) { big.src = ""; playVideo(p); viewer.classList.add("ui"); syncChrome(); }
  else { stopVideo(); big.src = p.dataUrl; }
  const d = new Date(p.added || Date.now());
  $("vDateB").textContent = d.toLocaleDateString("ko-KR", { month: "long", day: "numeric" });
  $("vDateS").textContent = d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });

  const sel = $("moveSel");
  sel.innerHTML = "";
  const opt = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); };
  opt("none", "미분류");
  for (const a of albums) opt(String(a.id), a.name);
  sel.value = p.albumId == null ? "none" : String(p.albumId);
  $("pos").textContent = `${viewIdx + 1} / ${viewList.length}`;

  Array.from(strip.children).forEach((el, i) => el.classList.toggle("cur", i === viewIdx));
  const curEl = strip.children[viewIdx];
  if (curEl && curEl.scrollIntoView) curEl.scrollIntoView({ inline: "center", block: "nearest" });
}

function syncChrome() {
  const open = viewer.classList.contains("open"), ui = viewer.classList.contains("ui");
  document.documentElement.classList.toggle("imm", open && !ui);
  document.documentElement.classList.toggle("wht", open && ui);
}
function openViewer(id) {
  viewList = filtered();
  const i = viewList.findIndex(p => p.id === id);
  if (i < 0) return;
  viewIdx = i;
  viewer.classList.remove("ui");
  viewer.classList.add("open");
  syncChrome();
  buildStrip();
  showPhoto();
}
function closeViewer() {
  viewer.classList.remove("open", "ui");
  syncChrome();
  big.src = "";
  stopVideo();
  currentId = null;
}
function go(delta) {
  const n = viewIdx + delta;
  if (n < 0 || n >= viewList.length) return;
  viewIdx = n;
  showPhoto();
}
function afterChange(prevId) {
  viewList = filtered();
  if (!viewList.length) { closeViewer(); return; }
  const i = viewList.findIndex(p => p.id === prevId);
  viewIdx = i >= 0 ? i : Math.min(viewIdx, viewList.length - 1);
  buildStrip();
  showPhoto();
}

let sx = 0, sy = 0;
stage.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
stage.addEventListener("pointerup", (e) => {
  if (e.target === bigv) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { viewer.classList.toggle("ui"); syncChrome(); return; }
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  else if (dy > 100 && Math.abs(dy) > Math.abs(dx)) closeViewer();
});
document.addEventListener("keydown", (e) => {
  if (!viewer.classList.contains("open")) return;
  if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowRight") go(1);
  else if (e.key === "Escape") closeViewer();
});

$("vBack").onclick = closeViewer;
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("file").addEventListener("change", async (e) => {
  await addFiles(Array.from(e.target.files));
  e.target.value = "";
});
$("newOk").onclick = createAlbum;
$("newName").addEventListener("keydown", (e) => { if (e.key === "Enter") createAlbum(); });

$("moveSel").onchange = async (e) => {
  const p = viewList[viewIdx];
  if (!p) return;
  p.albumId = e.target.value === "none" ? null : Number(e.target.value);
  await putPhoto(p);
  await loadAll();
  afterChange(p.id);
};

function twoStep(btn, label, action) {
  let armed = false, timer = null;
  const orig = btn.innerHTML;
  btn.onclick = async () => {
    if (!armed) {
      armed = true;
      btn.textContent = "정말 삭제";
      btn.classList.add("armed");
      timer = setTimeout(() => { armed = false; btn.classList.remove("armed"); btn.innerHTML = orig; }, 3000);
      return;
    }
    clearTimeout(timer);
    armed = false;
    btn.classList.remove("armed");
    btn.innerHTML = orig;
    await action();
  };
}
twoStep($("delete"), "삭제", async () => {
  if (currentId === null) return;
  const id = currentId;
  await removePhoto(id);
  await loadAll();
  afterChange(id);
});
twoStep($("albumDel"), "이 항목 삭제", async () => {
  if (typeof current !== "number") return;
  const id = current;
  for (const p of photos.filter(p => p.albumId === id)) {
    p.albumId = null;
    await putPhoto(p);
  }
  await run(store(ALBUMS, "readwrite").delete(id));
  current = "all";
  statusEl.textContent = "항목을 삭제했어요. 사진은 미분류로 옮겨졌어요.";
  await loadAll();
});

/* ---------- 잠금 화면 / Face ID ---------- */
async function getAuth() { return run(store(META, "readonly").get("auth")); }

async function showLock() {
  const m = await getAuth();
  setupMode = !m;
  $("lockTitle").textContent = setupMode ? "비밀번호 만들기" : "보관함 잠김";
  const standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  const iosTab = /iPhone|iPad/.test(navigator.userAgent) && !standalone;
  $("lockSub").textContent = setupMode
    ? (iosTab
        ? "여기서 만들면 나중에 사라질 수 있어요. 공유 → 홈 화면에 추가를 한 뒤, 그 아이콘으로 열어서 만들어 주세요."
        : "8자 이상으로 만들어 주세요. 잊어버리면 사진을 복구할 수 없어요.")
    : "비밀번호를 입력해 주세요.";
  pw1.value = ""; pw2.value = "";
  pw1.placeholder = setupMode ? "새 비밀번호" : "비밀번호";
  pw2.style.display = setupMode ? "" : "none";
  lockGo.textContent = setupMode ? "만들기" : "열기";
  lockMsg.textContent = "";
  faceGo.style.display = (!setupMode && m.face && window.PublicKeyCredential) ? "" : "none";
  lockEl.classList.remove("off");
}

async function enterVault() {
  lockMsg.textContent = "";
  pw1.value = ""; pw2.value = "";
  statusEl.textContent = "";
  await loadAll();
  lockEl.classList.add("off");
  updateFaceBtn();
}

function lockNow() {
  key = null; vaultRaw = null;
  photos = []; albums = [];
  closeViewer();
  grid.innerHTML = "";
  $("chips").innerHTML = "";
  $("albumBar").classList.remove("open");
  statusEl.textContent = "";
  showLock();
}

async function submitLock() {
  if (lockGo.disabled) return;
  const a = pw1.value;
  if (setupMode) {
    if (a.length < 8) { lockMsg.textContent = "8자 이상으로 만들어 주세요."; return; }
    if (a !== pw2.value) { lockMsg.textContent = "두 비밀번호가 달라요."; return; }
    lockGo.disabled = true;
    lockMsg.textContent = "만드는 중...";
    try {
      const salt = rnd(16), iter = 250000;
      const raw = await deriveRaw(a, salt, iter);
      key = await importKey(raw);
      vaultRaw = raw;
      const c = await encBytes(te.encode("vault-ok"));
      await run(store(META, "readwrite").put({ id: "auth", salt, iter, chkIv: c.iv, chk: c.data }));
      await enterVault();
    } catch (e) {
      key = null; vaultRaw = null;
      lockMsg.textContent = "오류: " + e.message;
    }
    lockGo.disabled = false;
    return;
  }
  const wait = lockedUntil - Date.now();
  if (wait > 0) { lockMsg.textContent = `${Math.ceil(wait / 1000)}초 뒤에 다시 시도해 주세요.`; return; }
  if (!a) return;
  lockGo.disabled = true;
  lockMsg.textContent = "확인 중...";
  try {
    const m = await getAuth();
    const raw = await deriveRaw(a, m.salt, m.iter);
    const k = await importKey(raw);
    let ok = false;
    try {
      const out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: m.chkIv }, k, m.chk);
      ok = td.decode(out) === "vault-ok";
    } catch (e) {}
    if (!ok) {
      fails++;
      if (fails >= 5) lockedUntil = Date.now() + Math.min(300, 30 * (fails - 4)) * 1000;
      lockMsg.textContent = "비밀번호가 맞지 않아요.";
    } else {
      fails = 0; key = k; vaultRaw = raw;
      await enterVault();
    }
  } catch (e) {
    lockMsg.textContent = "오류: " + e.message;
  }
  lockGo.disabled = false;
}

async function updateFaceBtn() {
  const b = $("faceBtn");
  if (!window.PublicKeyCredential) { b.style.display = "none"; return; }
  const m = await getAuth();
  b.style.display = "";
  b.textContent = m && m.face ? "Face ID 끄기" : "Face ID 켜기";
}
async function enableFace() {
  if (!vaultRaw) return;
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32),
      rp: { name: "사진 보관함" },
      user: { id: rnd(16), name: "vault", displayName: "vault" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
      timeout: 60000
    } });
    const dk = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    const iv = rnd(12);
    const wrapped = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, dk, vaultRaw);
    const m = await getAuth();
    m.face = { credId: cred.rawId, dk, iv, wrapped };
    await run(store(META, "readwrite").put(m));
    statusEl.textContent = "Face ID를 켰어요. 잠긴 뒤 'Face ID로 열기'를 눌러 보세요.";
  } catch (e) {
    statusEl.textContent = "이 화면에서는 Face ID를 쓸 수 없어요 (" + (e.name || "오류") + ").";
  }
  updateFaceBtn();
}
async function disableFace() {
  const m = await getAuth();
  delete m.face;
  await run(store(META, "readwrite").put(m));
  statusEl.textContent = "Face ID를 껐어요.";
  updateFaceBtn();
}
async function unlockWithFace() {
  const m = await getAuth();
  if (!m || !m.face) return;
  lockMsg.textContent = "Face ID 확인 중...";
  try {
    await navigator.credentials.get({ publicKey: {
      challenge: rnd(32),
      allowCredentials: [{ type: "public-key", id: m.face.credId }],
      userVerification: "required",
      timeout: 60000
    } });
    const raw = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: m.face.iv }, m.face.dk, m.face.wrapped));
    key = await importKey(raw);
    vaultRaw = raw;
    await enterVault();
  } catch (e) {
    key = null; vaultRaw = null;
    lockMsg.textContent = "Face ID로 열지 못했어요. 비밀번호로 열어 주세요.";
  }
}

lockGo.onclick = submitLock;
[pw1, pw2].forEach(el => el.addEventListener("keydown", (e) => { if (e.key === "Enter") submitLock(); }));
faceGo.onclick = unlockWithFace;
$("lockBtn").onclick = lockNow;
$("faceBtn").onclick = async () => {
  const m = await getAuth();
  if (m && m.face) disableFace(); else enableFace();
};

// 다른 앱으로 나갔다가 15초 넘게 지나 돌아오면 자동 잠금
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (key && hiddenAt && Date.now() - hiddenAt > 15000) lockNow();
});

(async function init() {
  try {
    if (!window.crypto || !crypto.subtle) {
      lockMsg.textContent = "이 환경에서는 암호화를 쓸 수 없어요.";
      lockGo.disabled = true;
      return;
    }
    db = await openDB();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    await showLock();
  } catch (err) {
    lockMsg.textContent = "저장소를 열 수 없어요: " + err.message;
  }
})();
</script>
