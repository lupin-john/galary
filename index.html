<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gallery">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ffffff;--fg:#1c1c1e;--accent:#1c1c1e;--muted:#8e8e93;--chip:#f2f2f7;--line:#d1d1d6}
@media (prefers-color-scheme: dark){:root{--bg:#000000;--fg:#f2f2f7;--accent:#3a3a3c;--muted:#98989d;--chip:#1c1c1e;--line:#38383a}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
button,select,input{font-family:inherit}
header{display:flex;justify-content:flex-start;align-items:center;gap:8px;padding:14px 16px 8px}
.btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:9px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.6}
input[type=file]{display:none}
#chips{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;background:var(--chip);color:var(--fg);border:0;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.chip.add{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
#newRow{display:none;gap:8px;padding:0 16px 10px}
#newRow.open{display:flex}
#newRow input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--muted);background:var(--bg);color:var(--fg);font-size:15px}
#albumBar{display:none;justify-content:space-between;align-items:center;padding:0 16px 8px;color:var(--muted);font-size:13px}
#albumBar.open{display:flex}
.small{background:var(--chip);color:var(--fg);border:0;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
#status{color:var(--muted);font-size:13px;padding:0 16px 6px;min-height:18px}
#empty{color:var(--muted);text-align:center;padding:60px 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px;padding:4px}
#grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer;display:block;background:var(--chip)}
.cell{position:relative}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:8px;padding:2px 7px;pointer-events:none}

#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;padding:24px;overflow-y:auto}
#lock.off{display:none}
.lockbox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center;margin:auto}
.lockbox svg{width:44px;height:44px;margin:0 auto;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lockbox h2{margin:0;font-size:20px;font-weight:600}
.lockbox p{margin:0;font-size:13px;color:var(--muted);min-height:18px}
.lockbox input{padding:13px 14px;border-radius:12px;border:1px solid var(--muted);background:var(--bg);color:var(--fg);font-size:16px;text-align:center}
.lockbox .btn{padding:13px 14px;font-size:16px}
.pane{display:flex;flex-direction:column;gap:12px;align-items:stretch}
#dial{width:min(80vw,300px);height:auto;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#dial.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#dots{font-size:20px;letter-spacing:3px;color:var(--accent);min-height:26px}
.hap{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}

#viewer{position:fixed;inset:0;background:#000;color:#fff;display:none;z-index:10;transition:background .2s;user-select:none;-webkit-user-select:none}
#viewer.open{display:block}
html.imm,html.imm body{background:#000}
html.wht,html.wht body{background:#fff}
#viewer.ui{background:#fff;color:#1c1c1e;--chip:#f0f0f3;--fg:#1c1c1e;--muted:#8e8e93}
@media (prefers-color-scheme: dark){#viewer.ui{background:#000;color:#f2f2f7;--chip:#2c2c2e;--fg:#f2f2f7;--muted:#98989d}html.wht,html.wht body{background:#000!important}}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;transition:padding .2s}
#viewer.ui #stage{padding:calc(72px + env(safe-area-inset-top,0px)) 0 calc(158px + env(safe-area-inset-bottom,0px))}
#big{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
#bigv{display:none;max-width:100%;max-height:100%;background:#000}
.vc{position:absolute;left:0;right:0;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
#viewer.ui .vc{opacity:1;visibility:visible}
#vTop{top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
#vBack{width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);color:var(--fg);font-size:24px;line-height:1;cursor:pointer}
#vDate{text-align:center}
#vDate b{display:block;font-size:15px;font-weight:600}
#vDate span{font-size:12px;color:var(--muted)}
#strip{bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;overflow-x:auto;padding:0 16px;height:60px;align-items:center;-webkit-overflow-scrolling:touch}
#strip img{height:46px;width:34px;object-fit:cover;border-radius:5px;flex:0 0 auto;opacity:.65;cursor:pointer;transition:width .15s,height .15s}
#strip img.cur{width:50px;height:56px;opacity:1;outline:2px solid var(--accent)}
#vBar{bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.cb{position:relative;height:52px;min-width:52px;border-radius:26px;border:0;background:var(--chip);color:var(--fg);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.12);padding:0}
.cb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#moveSel{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.pill{padding:0 6px;cursor:default}
.pill button{background:none;border:0;color:inherit;font-size:24px;width:40px;height:48px;cursor:pointer}
#pos{font-size:14px;min-width:56px;text-align:center}
#delete.armed{background:#d9534f;color:#fff;padding:0 20px}
</style>
</head>
<body>
<header>
  <button class="small" id="lockBtn">잠금</button>
  <button class="small" id="faceBtn" style="display:none"></button>
  <label class="btn" for="file" style="margin-left:auto">사진·영상 추가</label>
  <input id="file" type="file" accept="image/*,video/*" multiple>
</header>
<div id="chips"></div>
<div id="newRow">
  <input id="newName" type="text" placeholder="항목 이름 (예: 여행, 가족)" maxlength="30">
  <button class="btn" id="newOk">만들기</button>
</div>
<div id="albumBar"><span id="albumInfo"></span><button class="small" id="albumDel">이 항목 삭제</button></div>
<div id="status"></div>
<div id="empty">사진이 없어요. "사진·영상 추가"를 눌러 보세요.</div>
<div id="grid"></div>

<div id="viewer">
  <div id="stage"><img id="big" alt=""><video id="bigv" controls playsinline></video></div>
  <div id="vTop" class="vc">
    <button id="vBack" aria-label="닫기">‹</button>
    <div id="vDate"><b id="vDateB"></b><span id="vDateS"></span></div>
    <span></span>
  </div>
  <div id="strip" class="vc"></div>
  <div id="vBar" class="vc">
    <label class="cb" aria-label="항목 이동"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><select id="moveSel"></select></label>
    <div class="cb pill"><button id="prev" aria-label="이전">‹</button><span id="pos"></span><button id="next" aria-label="다음">›</button></div>
    <button class="cb" id="delete" aria-label="삭제"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
  </div>
</div>

<div id="lock">
  <div class="lockbox">
    <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <h2 id="lockTitle">보관함 잠김</h2>
    <p id="lockSub"></p>

    <div id="pFace" class="pane" style="display:none">
      <button class="btn" id="faceGo">Face ID로 시작</button>
      <button class="small" id="faceSkip" style="display:none;padding:11px">Face ID 없이 계속</button>
    </div>

    <div id="pDial" class="pane" style="display:none">
      <svg id="dial" viewBox="-155 -155 310 310">
        <circle r="148" style="fill:var(--chip);stroke:var(--line);stroke-width:2"/>
        <g id="ring" style="color:var(--fg)"></g>
        <circle r="70" style="fill:var(--bg);stroke:var(--line);stroke-width:2"/>
        <text id="dialNum" x="0" y="0" text-anchor="middle" dominant-baseline="central" font-size="44" font-weight="700" style="fill:var(--fg)">0</text>
        <polygon points="0,-150 -9,-134 9,-134" style="fill:var(--accent)"/>
      </svg>
      <div id="dots"></div>
      <p id="dialHint"></p>
      <button class="btn" id="dialOk">확인</button>
    </div>

    <div id="pPw" class="pane" style="display:none">
      <input id="pw1" type="password" placeholder="비밀번호" autocomplete="off">
      <input id="pw2" type="password" placeholder="비밀번호 다시 입력" autocomplete="new-password" style="display:none">
      <button class="btn" id="lockGo">열기</button>
    </div>
    <p id="lockMsg"></p>
  </div>
</div>
<label id="hapLabel" class="hap"><input type="checkbox" switch></label>

<script>
const LEGACY = "photo-vault", DB_NAME = "gallery-vault", PHOTOS = "photos", ALBUMS = "albums", VIDS = "vids", META = "meta";
let db = null, currentId = null;
let photos = [], albums = [];
let current = "all";
let viewList = [], viewIdx = 0, curVidUrl = null;
let key = null;
let mode = "unlock", authMeta = null, legacyDb = null, legacyAuth = null, legacyKey = null, tmpCombo = null;
let fails = 0, lockedUntil = 0, hiddenAt = 0;

const $ = (id) => document.getElementById(id);
const grid = $("grid"), empty = $("empty"), statusEl = $("status"), viewer = $("viewer"), big = $("big"), stage = $("stage"), strip = $("strip"), bigv = $("bigv");
const lockEl = $("lock"), pw1 = $("pw1"), pw2 = $("pw2"), lockMsg = $("lockMsg"), lockGo = $("lockGo"), faceGo = $("faceGo");

/* ---------- 저장소 ---------- */
function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, 4);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains(PHOTOS)) d.createObjectStore(PHOTOS, { keyPath: "id", autoIncrement: true });
      if (!d.objectStoreNames.contains(ALBUMS)) d.createObjectStore(ALBUMS, { keyPath: "id", autoIncrement: true });
      if (!d.objectStoreNames.contains(VIDS)) d.createObjectStore(VIDS, { keyPath: "id" });
      if (!d.objectStoreNames.contains(META)) d.createObjectStore(META, { keyPath: "id" });
    };
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
const store = (name, mode) => db.transaction(name, mode).objectStore(name);
function run(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

/* ---------- 암호화 (AES-GCM, 비밀번호 → PBKDF2) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
async function deriveRaw(password, salt, iter) {
  const base = await crypto.subtle.importKey("raw", te.encode(password), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt, iterations: iter }, base, 256));
}
const importKey = (raw) => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
async function encBytes(bytes, k = key) {
  const iv = rnd(12);
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, bytes);
  return { iv, data };
}
async function decBytes(iv, data, k = key) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, k, data));
}
const encJson = (o) => encBytes(te.encode(JSON.stringify(o)));
async function decJson(rec) { return JSON.parse(td.decode(await decBytes(rec.iv, rec.data))); }

function photoMeta(p) {
  return { dataUrl: p.dataUrl, name: p.name, added: p.added, albumId: p.albumId == null ? null : p.albumId, type: p.type || "image", duration: p.duration || 0 };
}
async function savePhoto(meta, file) {
  const e = await encJson(meta);
  const id = await run(store(PHOTOS, "readwrite").add({ v: 2, iv: e.iv, data: e.data }));
  if (file) {
    try {
      const ve = await encBytes(new Uint8Array(await file.arrayBuffer()));
      await run(store(VIDS, "readwrite").put({ id, iv: ve.iv, data: ve.data, vtype: file.type || "video/mp4" }));
    } catch (err) {
      await run(store(PHOTOS, "readwrite").delete(id));
      throw err;
    }
  }
  return id;
}
async function putPhoto(p) {
  const e = await encJson(photoMeta(p));
  await run(store(PHOTOS, "readwrite").put({ id: p.id, v: 2, iv: e.iv, data: e.data }));
}
async function removePhoto(id) {
  await run(store(PHOTOS, "readwrite").delete(id));
  await run(store(VIDS, "readwrite").delete(id));
}

function toDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1600;
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", 0.9));
      };
      img.onerror = () => reject(new Error("이미지를 읽을 수 없어요: " + file.name));
      img.src = reader.result;
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function loadAll() {
  const recs = await run(store(PHOTOS, "readonly").getAll());
  const list = [];
  for (const r of recs) {
    if (r.v !== 2) continue;
    try { const o = await decJson(r); o.id = r.id; list.push(o); } catch (e) { /* 복호화 실패 항목 건너뜀 */ }
  }
  photos = list.sort((a, b) => b.id - a.id);
  const arecs = await run(store(ALBUMS, "readonly").getAll());
  const al = [];
  for (const r of arecs) {
    if (r.v !== 2) continue;
    try { const o = await decJson(r); o.id = r.id; al.push(o); } catch (e) {}
  }
  albums = al.sort((a, b) => a.id - b.id);
  if (typeof current === "number" && !albums.some(a => a.id === current)) current = "all";
  render();
}

function albumOf(p) { return p.albumId == null ? "none" : p.albumId; }
function filtered() { return photos.filter(p => current === "all" || albumOf(p) === current); }

function render() {
  const chips = $("chips");
  chips.innerHTML = "";
  const mk = (label, k) => {
    const b = document.createElement("button");
    b.className = "chip" + (current === k ? " on" : "");
    b.textContent = label;
    b.onclick = () => { current = k; render(); };
    chips.appendChild(b);
  };
  mk(`전체 ${photos.length}`, "all");
  const noneCount = photos.filter(p => p.albumId == null).length;
  if (noneCount) mk(`미분류 ${noneCount}`, "none");
  for (const a of albums) mk(`${a.name} ${photos.filter(p => p.albumId === a.id).length}`, a.id);
  const add = document.createElement("button");
  add.className = "chip add";
  add.textContent = "+ 새 항목";
  add.onclick = () => { $("newRow").classList.add("open"); $("newName").focus(); };
  chips.appendChild(add);

  const cur = albums.find(a => a.id === current);
  $("albumBar").classList.toggle("open", !!cur);
  if (cur) $("albumInfo").textContent = `"${cur.name}" 항목`;

  const list = filtered();
  grid.innerHTML = "";
  empty.style.display = list.length ? "none" : "block";
  for (const p of list) {
    const cell = document.createElement("div");
    cell.className = "cell";
    const img = document.createElement("img");
    img.src = p.dataUrl;
    img.alt = p.name || "";
    cell.appendChild(img);
    if (p.type === "video") {
      const d = document.createElement("span");
      d.className = "dur";
      d.textContent = "▶ " + fmtDur(p.duration);
      cell.appendChild(d);
    }
    cell.onclick = () => openViewer(p.id);
    grid.appendChild(cell);
  }
}

async function addFiles(files) {
  const list = files.filter(f => f.type.startsWith("image/") || f.type.startsWith("video/") || /\.(heic|heif|mov|mp4|m4v)$/i.test(f.name));
  const albumId = typeof current === "number" ? current : null;
  let count = 0;
  for (const file of list) {
    try {
      statusEl.textContent = `암호화해서 저장 중... (${count + 1}/${list.length})`;
      if (file.type.startsWith("video/") || /\.(mov|mp4|m4v)$/i.test(file.name)) {
        if (file.size > 100 * 1024 * 1024) throw new Error("영상이 너무 커요 (100MB 이하만 가능): " + file.name);
        const v = await videoPoster(file);
        await savePhoto({ dataUrl: v.dataUrl, name: file.name, added: Date.now(), albumId, type: "video", duration: v.duration }, file);
      } else {
        const dataUrl = await toDataUrl(file);
        await savePhoto({ dataUrl, name: file.name, added: Date.now(), albumId, type: "image", duration: 0 });
      }
      count++;
    } catch (err) {
      statusEl.textContent = err.message;
    }
  }
  if (count) statusEl.textContent = `${count}개 저장했어요.`;
  await loadAll();
}

async function createAlbum() {
  const name = $("newName").value.trim();
  if (!name) return;
  const e = await encJson({ name, created: Date.now() });
  const id = await run(store(ALBUMS, "readwrite").add({ v: 2, iv: e.iv, data: e.data }));
  $("newName").value = "";
  $("newRow").classList.remove("open");
  current = id;
  await loadAll();
}

/* ---------- 영상 ---------- */
function fmtDur(s) { s = Math.round(s || 0); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function grayPoster() {
  const c = document.createElement("canvas");
  c.width = 480; c.height = 480;
  const x = c.getContext("2d");
  x.fillStyle = "#3a3a46";
  x.fillRect(0, 0, 480, 480);
  return c.toDataURL("image/jpeg", 0.8);
}
function videoPoster(file) {
  return new Promise((resolve) => {
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "metadata";
    let done = false, tried = 0, timer = null, blobUrl = null;
    const finish = (dataUrl) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      resolve({ dataUrl: dataUrl || grayPoster(), duration: isFinite(v.duration) ? v.duration : 0 });
    };
    const attempt = () => {
      clearTimeout(timer);
      timer = setTimeout(retry, 6000);
      if (tried === 0) { blobUrl = URL.createObjectURL(file); v.src = blobUrl; }
      else {
        const r = new FileReader();
        r.onload = () => { v.src = r.result; };
        r.onerror = () => finish(null);
        r.readAsDataURL(file);
      }
    };
    const retry = () => {
      if (done) return;
      tried++;
      if (tried > 1 || file.size > 80 * 1024 * 1024) finish(null); else attempt();
    };
    v.onerror = retry;
    v.onloadedmetadata = () => { try { v.currentTime = Math.min(0.1, (v.duration || 1) / 2); } catch (e) {} };
    v.onseeked = () => {
      try {
        const w = v.videoWidth, h = v.videoHeight;
        if (!w || !h) return retry();
        const s = Math.min(1, 480 / Math.max(w, h));
        const c = document.createElement("canvas");
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        finish(c.toDataURL("image/jpeg", 0.8));
      } catch (e) { retry(); }
    };
    attempt();
  });
}
function stopVideo() {
  bigv.onerror = null;
  bigv.pause();
  bigv.removeAttribute("src");
  bigv.removeAttribute("poster");
  bigv.load();
  if (curVidUrl) { URL.revokeObjectURL(curVidUrl); curVidUrl = null; }
}
async function playVideo(p) {
  stopVideo();
  bigv.poster = p.dataUrl;
  try {
    const rec = await run(store(VIDS, "readonly").get(p.id));
    if (!rec || currentId !== p.id) return;
    const buf = await decBytes(rec.iv, rec.data);
    if (currentId !== p.id) return;
    const blob = new Blob([buf], { type: rec.vtype || "video/mp4" });
    let fell = false;
    bigv.onerror = () => {
      if (fell) return;
      fell = true;
      const r = new FileReader();
      r.onload = () => { bigv.src = r.result; };
      r.readAsDataURL(blob);
    };
    curVidUrl = URL.createObjectURL(blob);
    bigv.src = curVidUrl;
  } catch (e) {
    statusEl.textContent = "영상을 열 수 없어요.";
  }
}

/* ---------- 전체 화면 뷰어 ---------- */
function buildStrip() {
  strip.innerHTML = "";
  viewList.forEach((p, i) => {
    const t = document.createElement("img");
    t.src = p.dataUrl;
    t.alt = "";
    t.onclick = () => { viewIdx = i; showPhoto(); };
    strip.appendChild(t);
  });
}

function showPhoto() {
  const p = viewList[viewIdx];
  if (!p) return;
  currentId = p.id;
  const isVid = p.type === "video";
  big.style.display = isVid ? "none" : "";
  bigv.style.display = isVid ? "block" : "none";
  if (isVid) { big.src = ""; playVideo(p); viewer.classList.add("ui"); syncChrome(); }
  else { stopVideo(); big.src = p.dataUrl; }
  const d = new Date(p.added || Date.now());
  $("vDateB").textContent = d.toLocaleDateString("ko-KR", { month: "long", day: "numeric" });
  $("vDateS").textContent = d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });

  const sel = $("moveSel");
  sel.innerHTML = "";
  const opt = (v, t) => { const o = document.createElement("option"); o.value = v; o.textContent = t; sel.appendChild(o); };
  opt("none", "미분류");
  for (const a of albums) opt(String(a.id), a.name);
  sel.value = p.albumId == null ? "none" : String(p.albumId);
  $("pos").textContent = `${viewIdx + 1} / ${viewList.length}`;

  Array.from(strip.children).forEach((el, i) => el.classList.toggle("cur", i === viewIdx));
  const curEl = strip.children[viewIdx];
  if (curEl && curEl.scrollIntoView) curEl.scrollIntoView({ inline: "center", block: "nearest" });
}

function syncChrome() {
  const open = viewer.classList.contains("open"), ui = viewer.classList.contains("ui");
  document.documentElement.classList.toggle("imm", open && !ui);
  document.documentElement.classList.toggle("wht", open && ui);
}
function openViewer(id) {
  viewList = filtered();
  const i = viewList.findIndex(p => p.id === id);
  if (i < 0) return;
  viewIdx = i;
  viewer.classList.remove("ui");
  viewer.classList.add("open");
  syncChrome();
  buildStrip();
  showPhoto();
}
function closeViewer() {
  viewer.classList.remove("open", "ui");
  syncChrome();
  big.src = "";
  stopVideo();
  currentId = null;
}
function go(delta) {
  const n = viewIdx + delta;
  if (n < 0 || n >= viewList.length) return;
  viewIdx = n;
  showPhoto();
}
function afterChange(prevId) {
  viewList = filtered();
  if (!viewList.length) { closeViewer(); return; }
  const i = viewList.findIndex(p => p.id === prevId);
  viewIdx = i >= 0 ? i : Math.min(viewIdx, viewList.length - 1);
  buildStrip();
  showPhoto();
}

let sx = 0, sy = 0;
stage.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
stage.addEventListener("pointerup", (e) => {

  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);

document.addEventListener("keydown", (e) => {

/* ---------- 잠금 (Face ID → 다이얼 3개 → 비밀번호) ---------- */
async function getAuth() { return run(store(META, "readonly").get("auth")); }

const panes = { face: $("pFace"), dial: $("pDial"), pw: $("pPw") };
function showPane(name) { for (const k in panes) panes[k].style.display = k === name ? "" : "none"; }
function isIosTab() {
  const standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  return /iPhone|iPad/.test(navigator.userAgent) && !standalone;
}

/* ----- 다이얼 ----- */
const DIRS = [1, -1, 1];   // 오른쪽 → 왼쪽 → 오른쪽
let dialResolve = null, dialStep = 0, dialCombo = [], dialNet = 0, dialTheta = 0, lastTick = 0, dragging = false, lastAng = 0, showNums = false;
const dialSvg = $("dial"), ringG = $("ring");

(function buildDial() {
  const NS = "http://www.w3.org/2000/svg";
  const mkEl = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  for (let n = 0; n < 100; n++) {
    const a = -n * 3.6;
    const len = n % 10 === 0 ? 16 : (n % 5 === 0 ? 10 : 6);
    const g = mkEl("g", { transform: `rotate(${a})` });
    g.appendChild(mkEl("line", { x1: 0, y1: -126, x2: 0, y2: -126 + len, stroke: "currentColor", "stroke-width": n % 10 === 0 ? 2.2 : 1, "stroke-linecap": "round" }));
    ringG.appendChild(g);
    if (n % 10 === 0) {
      const t = mkEl("text", { x: 0, y: 0, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 13, "font-weight": 600, fill: "currentColor", transform: `rotate(${a}) translate(0,-100) rotate(${-a})` });
      t.textContent = String(n);
      ringG.appendChild(t);
    }
  }
})();

const tickIdx = () => Math.round(dialTheta / 3.6);
const curNum = () => ((tickIdx() % 100) + 100) % 100;
function renderDial() {
  ringG.setAttribute("transform", `rotate(${tickIdx() * 3.6})`);
  $("dialNum").textContent = String(curNum());
}
function updateDialUI() {
  const marks = [0, 1, 2].map(i => i < dialStep ? "●" : (i === dialStep ? "◉" : "○")).join(" ");
  $("dots").textContent = marks + (showNums && dialCombo.length ? "   " + dialCombo.join(" – ") : "");
  $("dialHint").textContent = DIRS[dialStep] > 0 ? "오른쪽(시계 방향)으로 돌려 번호를 맞추고 확인" : "왼쪽(반시계 방향)으로 돌려 번호를 맞추고 확인";
  renderDial();
}
function runDial(show) {
  return new Promise((resolve) => {
    dialResolve = resolve; showNums = !!show;
    dialStep = 0; dialCombo = []; dialNet = 0; lastTick = tickIdx();
    updateDialUI();
    showPane("dial");
  });
}
function stopDial() { dialResolve = null; dragging = false; }

/* 딸깍 소리 + 진동 (진동은 기기·브라우저에 따라 안 될 수 있음) */
let actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function clickSound(strong) {
  if (!actx) return;
  try {
    const len = Math.floor(actx.sampleRate * (strong ? 0.06 : 0.02));
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.16));
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = strong ? 1100 : 2400; f.Q.value = 1.1;
    const g = actx.createGain();
    g.gain.value = strong ? 0.9 : 0.45;
    src.connect(f); f.connect(g); g.connect(actx.destination);
    src.start();
  } catch (e) {}
}
const hapLabel = $("hapLabel");
function haptic(strong) {
  try { if (navigator.vibrate) navigator.vibrate(strong ? [14, 40, 14] : 8); } catch (e) {}
  try { hapLabel.click(); if (strong) setTimeout(() => { try { hapLabel.click(); } catch (e) {} }, 70); } catch (e) {}
}
function shake() {
  dialSvg.classList.remove("shake");
  void dialSvg.getBoundingClientRect();
  dialSvg.classList.add("shake");
}

const angleOf = (e) => {
  const r = dialSvg.getBoundingClientRect();
  return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
};
dialSvg.addEventListener("pointerdown", (e) => {
  if (!dialResolve) return;
  e.preventDefault();
  ensureAudio();
  dragging = true;
  try { dialSvg.setPointerCapture(e.pointerId); } catch (x) {}
  lastAng = angleOf(e);
  lastTick = tickIdx();
});
dialSvg.addEventListener("pointermove", (e) => {
  if (!dragging || !dialResolve) return;
  const a = angleOf(e);
  let d = a - lastAng;
  if (d > 180) d -= 360;
  if (d < -180) d += 360;
  lastAng = a;
  dialTheta += d; dialNet += d;
  const ti = tickIdx();
  if (ti !== lastTick) { lastTick = ti; clickSound(false); haptic(false); renderDial(); }
});
const endDrag = () => { dragging = false; };
dialSvg.addEventListener("pointerup", endDrag);
dialSvg.addEventListener("pointercancel", endDrag);

$("dialOk").onclick = () => {
  if (!dialResolve) return;
  ensureAudio();
  const need = DIRS[dialStep];
  if (dialNet * need < 2) {
    lockMsg.textContent = need > 0 ? "오른쪽으로 돌려서 맞춰 주세요." : "왼쪽으로 돌려서 맞춰 주세요.";
    dialNet = 0;
    shake(); clickSound(false);
    return;
  }
  dialCombo.push(curNum());
  clickSound(true); haptic(true);
  dialStep++; dialNet = 0;
  lockMsg.textContent = "";
  if (dialStep >= 3) {
    const r = dialResolve;
    dialResolve = null;
    r(dialCombo.slice());
  } else updateDialUI();
};

/* ----- 잠금 흐름 ----- */
let lockBusy = false;
function setBusy(b) { lockBusy = b; lockGo.disabled = b; }

async function showLock() {
  stopDial();
  setBusy(false);
  lockEl.classList.remove("off");
  lockMsg.textContent = "";
  pw1.value = ""; pw2.value = "";
  if (legacyDb) { try { legacyDb.close(); } catch (e) {} legacyDb = null; }
  const m = await getAuth();
  if (m && m.ver === 3) { authMeta = m; startUnlock(); return; }
  // 새 저장소에 잠금 정보가 없으면, 예전 버전(비밀번호만) 보관함이 있는지 확인
  legacyDb = await openLegacy();
  if (legacyDb && legacyDb.objectStoreNames.contains(META)) {
    const la = await run(legacyDb.transaction(META, "readonly").objectStore(META).get("auth"));
    if (la && la.chk) { legacyAuth = la; startMigratePw(); return; }
  }
  if (legacyDb) { try { legacyDb.close(); } catch (e) {} legacyDb = null; }
  startSetupPw();
}

function openLegacy() {
  return new Promise((resolve) => {
    try {
      const r = indexedDB.open(LEGACY);
      r.onupgradeneeded = () => { try { r.transaction.abort(); } catch (e) {} };  // 없던 DB면 만들지 않음
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => resolve(null);
      r.onblocked = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}

function setPwPane(title, sub, placeholder, auto, confirmField, btnText, numeric) {
  $("lockTitle").textContent = title;
  $("lockSub").textContent = sub;
  pw1.value = ""; pw2.value = "";
  pw1.placeholder = placeholder;
  pw2.placeholder = placeholder + " 다시 입력";
  for (const el of [pw1, pw2]) {
    el.dataset.num = numeric ? "1" : "0";
    el.inputMode = numeric ? "numeric" : "text";
    el.maxLength = numeric ? 4 : 128;
  }
  pw1.setAttribute("autocomplete", auto);
  pw2.style.display = confirmField ? "" : "none";
  lockGo.textContent = btnText;
  showPane("pw");
}

/* 열기: Face ID → 다이얼 → 비밀번호 */
function startUnlock() {
  mode = "unlock";
  $("lockTitle").textContent = "보관함 잠김";
  if (authMeta.face && window.PublicKeyCredential) {
    $("lockSub").textContent = "1단계: Face ID";
    $("faceSkip").style.display = "none";
    showPane("face");
  } else startUnlockDial();
}
async function startUnlockDial() {
  mode = "unlock";
  $("lockTitle").textContent = "보관함 잠김";
  $("lockSub").textContent = "다이얼을 돌려 번호 3개를 맞춰 주세요.";
  tmpCombo = await runDial(false);
  const pin = !!authMeta.pin;
  setPwPane("보관함 잠김", pin ? "마지막으로 숫자 4자리를 입력해 주세요." : "마지막으로 비밀번호를 입력해 주세요.",
    pin ? "숫자 4자리" : "비밀번호", "off", false, "열기", pin);
}
faceGo.onclick = async () => {
  lockMsg.textContent = "Face ID 확인 중...";
  try {
    await navigator.credentials.get({ publicKey: {
      challenge: rnd(32),
      allowCredentials: [{ type: "public-key", id: authMeta.face.credId }],
      userVerification: "required",
      timeout: 60000
    } });
    lockMsg.textContent = "";
    startUnlockDial();
  } catch (e) {
    lockMsg.textContent = "Face ID가 확인되지 않았어요.";
    $("faceSkip").style.display = "";
  }
};
$("faceSkip").onclick = () => { lockMsg.textContent = ""; startUnlockDial(); };

async function submitUnlock() {
  const wait = lockedUntil - Date.now();
  if (wait > 0) { lockMsg.textContent = `${Math.ceil(wait / 1000)}초 뒤에 다시 시도해 주세요.`; return; }
  const a = pw1.value;
  if (!a || !tmpCombo) return;
  setBusy(true);
  lockMsg.textContent = "확인 중...";
  let ok = false;
  try {
    const m = authMeta;
    const kekRaw = await deriveRaw(a + "\u0000" + tmpCombo.join("-"), m.salt, m.iter);
    const kek = await importKey(kekRaw);
    try {
      const dkRaw = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: m.wIv }, kek, m.wrapped));
      const k = await importKey(dkRaw);
      const out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: m.chkIv }, k, m.chk);
      if (td.decode(out) === "vault-ok") { key = k; ok = true; }
    } catch (e) {}
  } catch (e) {
    lockMsg.textContent = "오류: " + e.message;
    setBusy(false);
    return;
  }
  tmpCombo = null;
  if (ok) {
    fails = 0;
    try { await enterVault(); } catch (e) { lockMsg.textContent = "오류: " + e.message; }
    setBusy(false);
  } else {
    fails++;
    if (fails >= 5) lockedUntil = Date.now() + Math.min(300, 30 * (fails - 4)) * 1000;
    setBusy(false);
    startUnlockDial();
    lockMsg.textContent = "맞지 않아요. 번호부터 다시 맞춰 주세요.";
  }
}

/* 새로 만들기 */
async function askNewCombo() {
  while (true) {
    $("lockSub").textContent = "다이얼 번호 3개를 정해서 돌려 주세요. (오른쪽 → 왼쪽 → 오른쪽) 정한 번호는 꼭 기억해 두세요.";
    const c1 = await runDial(true);
    $("lockSub").textContent = "확인을 위해 같은 번호를 한 번 더 맞춰 주세요.";
    const c2 = await runDial(false);
    if (c1.join("-") === c2.join("-")) return c1;
    lockMsg.textContent = "두 번이 달라요. 처음부터 다시 정해 주세요.";
  }
}
async function createVault(pw, combo, dkRaw) {
  dkRaw = dkRaw || rnd(32);
  const salt = rnd(16), iter = 500000;
  const kekRaw = await deriveRaw(pw + "\u0000" + combo.join("-"), salt, iter);
  const kek = await importKey(kekRaw);
  const wIv = rnd(12);
  const wrapped = await crypto.subtle.encrypt({ name: "AES-GCM", iv: wIv }, kek, dkRaw);
  key = await importKey(dkRaw);
  const c = await encBytes(te.encode("vault-ok"));
  await run(store(META, "readwrite").put({ id: "auth", ver: 3, pin: /^\d{4}$/.test(pw), salt, iter, wIv, wrapped, chkIv: c.iv, chk: c.data }));
}

function startSetupPw() {
  mode = "setup";
  setPwPane("비밀번호 만들기",
    isIosTab() ? "여기서 만들면 나중에 사라질 수 있어요. 공유 → 홈 화면에 추가를 한 뒤, 그 아이콘으로 열어서 만들어 주세요."
               : "숫자 4자리로 만들어 주세요. 잊어버리면 복구할 수 없어요.",
    "숫자 4자리", "new-password", true, "다음", true);
}
async function submitSetup() {
  const a = pw1.value;
  if (!/^\d{4}$/.test(a)) { lockMsg.textContent = "숫자 4자리로 만들어 주세요."; return; }
  if (a !== pw2.value) { lockMsg.textContent = "두 비밀번호가 달라요."; return; }
  setBusy(true);
  lockMsg.textContent = "";
  try {
    const combo = await askNewCombo();
    lockMsg.textContent = "만드는 중...";
    await createVault(a, combo);
    await enterVault();
  } catch (e) {
    key = null;
    lockMsg.textContent = "오류: " + e.message;
    startSetupPw();
  }
  setBusy(false);
}

/* 예전 보관함(비밀번호만) → 새 보관함으로 옮기기 */
function startMigratePw() {
  mode = "migrate";
  setPwPane("보관함 업그레이드",
    "다이얼 잠금이 추가됐어요. 먼저 지금 쓰는 비밀번호를 입력해 주세요. 사진과 영상은 그대로 옮겨져요.",
    "지금 비밀번호", "current-password", false, "다음", false);
}
async function submitMigrate() {
  const wait = lockedUntil - Date.now();
  if (wait > 0) { lockMsg.textContent = `${Math.ceil(wait / 1000)}초 뒤에 다시 시도해 주세요.`; return; }
  const a = pw1.value;
  if (!a) return;
  setBusy(true);
  lockMsg.textContent = "확인 중...";
  try {
    const raw = await deriveRaw(a, legacyAuth.salt, legacyAuth.iter);
    const k = await importKey(raw);
    let ok = false;
    try {
      const out = await crypto.subtle.decrypt({ name: "AES-GCM", iv: legacyAuth.chkIv }, k, legacyAuth.chk);
      ok = td.decode(out) === "vault-ok";
    } catch (e) {}
    if (!ok) {
      fails++;
      if (fails >= 5) lockedUntil = Date.now() + Math.min(300, 30 * (fails - 4)) * 1000;
      lockMsg.textContent = "비밀번호가 맞지 않아요.";
      setBusy(false);
      return;
    }
    fails = 0;
    legacyKey = k;
    const combo = await askNewCombo();
    lockMsg.textContent = "옮기는 중... 닫지 말고 기다려 주세요.";
    await migrateData(a, combo);
    await enterVault();
  } catch (e) {
    lockMsg.textContent = "오류: " + e.message + " (기존 데이터는 그대로예요)";
    startMigratePw();
  }
  setBusy(false);
}
async function migrateData(pw, combo) {
  const dkRaw = rnd(32);
  const newKey = await importKey(dkRaw);
  const lt = (name) => legacyDb.transaction(name, "readonly").objectStore(name);
  for (const s of [PHOTOS, ALBUMS, VIDS, META]) await run(store(s, "readwrite").clear());
  const copyJson = async (name) => {
    const recs = await run(lt(name).getAll());
    let c = 0;
    for (const r of recs) {
      if (r.v !== 2) continue;
      const o = JSON.parse(td.decode(await decBytes(r.iv, r.data, legacyKey)));
      const e = await encBytes(te.encode(JSON.stringify(o)), newKey);
      await run(store(name, "readwrite").put({ id: r.id, v: 2, iv: e.iv, data: e.data }));
      c++;
    }
    if (c !== recs.length) throw new Error("일부 항목을 옮길 수 없어요");
    return c;
  };
  const pc = await copyJson(PHOTOS);
  await copyJson(ALBUMS);
  if (legacyDb.objectStoreNames.contains(VIDS)) {
    const ids = await run(lt(VIDS).getAllKeys());
    let n = 0;
    for (const id of ids) {
      lockMsg.textContent = `영상 옮기는 중... (${++n}/${ids.length})`;
      const r = await run(lt(VIDS).get(id));
      const buf = await decBytes(r.iv, r.data, legacyKey);
      const e = await encBytes(buf, newKey);
      await run(store(VIDS, "readwrite").put({ id, iv: e.iv, data: e.data, vtype: r.vtype }));
    }
  }
  const check = await run(store(PHOTOS, "readonly").count());
  if (check !== pc) throw new Error("옮긴 개수가 맞지 않아요");
  await createVault(pw, combo, dkRaw);     // 잠금 정보는 맨 마지막에 저장
  try { legacyDb.close(); indexedDB.deleteDatabase(LEGACY); } catch (e) {}
  legacyDb = null; legacyKey = null;
}

async function enterVault() {
  stopDial();
  lockMsg.textContent = "";
  pw1.value = ""; pw2.value = "";
  statusEl.textContent = "";
  await loadAll();
  lockEl.classList.add("off");
  updateFaceBtn();
}

function lockNow() {
  key = null; tmpCombo = null;
  photos = []; albums = [];
  closeViewer();
  grid.innerHTML = "";
  $("chips").innerHTML = "";
  $("albumBar").classList.remove("open");
  statusEl.textContent = "";
  showLock();
}

function submitLock() {
  if (lockBusy) return;
  if (mode === "unlock") submitUnlock();
  else if (mode === "setup") submitSetup();
  else if (mode === "migrate") submitMigrate();
}

/* ----- Face ID 켜기/끄기 (1단계 확인용) ----- */
async function updateFaceBtn() {
  const b = $("faceBtn");
  if (!window.PublicKeyCredential) { b.style.display = "none"; return; }
  const m = await getAuth();
  b.style.display = "";
  b.textContent = m && m.face ? "Face ID 끄기" : "Face ID 켜기";
}
async function enableFace() {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rnd(32),
      rp: { name: "사진 보관함" },
      user: { id: rnd(16), name: "vault", displayName: "vault" },
      pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
      timeout: 60000
    } });
    const m = await getAuth();
    m.face = { credId: cred.rawId };
    await run(store(META, "readwrite").put(m));
    statusEl.textContent = "Face ID를 켰어요. 다음에 잠기면 Face ID부터 시작해요.";
  } catch (e) {
    statusEl.textContent = "Face ID를 켤 수 없어요 (" + (e.name || "오류") + ").";
  }
  updateFaceBtn();
}
async function disableFace() {
  const m = await getAuth();
  delete m.face;
  await run(store(META, "readwrite").put(m));
  statusEl.textContent = "Face ID를 껐어요.";
  updateFaceBtn();
}

lockGo.onclick = submitLock;
[pw1, pw2].forEach(el => el.addEventListener("keydown", (e) => { if (e.key === "Enter") submitLock(); }));
[pw1, pw2].forEach(el => el.addEventListener("input", () => { if (el.dataset.num === "1") el.value = el.value.replace(/\D/g, "").slice(0, 4); }));
$("lockBtn").onclick = lockNow;
$("faceBtn").onclick = async () => {
  const m = await getAuth();
  if (m && m.face) disableFace(); else enableFace();
};

// 다른 앱으로 나갔다가 5분 넘게 지나 돌아오면 자동 잠금
const AUTO_LOCK_MS = 5 * 60 * 1000;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (key && hiddenAt && Date.now() - hiddenAt > AUTO_LOCK_MS) lockNow();
});

// 초기화 표식: 이 값이 저장된 값과 다르면 저장된 모든 데이터(사진·영상·잠금 정보)를 한 번 지우고 처음부터 시작
const RESET_ID = "reset-1";
async function applyReset() {
  const mark = await run(store(META, "readonly").get("resetMark"));
  if (mark && mark.v === RESET_ID) return;
  for (const s of [PHOTOS, ALBUMS, VIDS, META]) await run(store(s, "readwrite").clear());
  await new Promise((resolve) => {
    try {
      const q = indexedDB.deleteDatabase(LEGACY);
      q.onsuccess = q.onerror = q.onblocked = () => resolve();
    } catch (e) { resolve(); }
  });
  await run(store(META, "readwrite").put({ id: "resetMark", v: RESET_ID }));
}

(async function init() {
  try {
    if (!window.crypto || !crypto.subtle) {
      lockMsg.textContent = "이 환경에서는 암호화를 쓸 수 없어요.";
      lockGo.disabled = true;
      return;
    }
    db = await openDB();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    await applyReset();
    await showLock();
  } catch (err) {
    lockMsg.textContent = "저장소를 열 수 없어요: " + err.message;
  }
})();
</script>
